# Entheo.News Jekyll Configuration
title: Entheo.News
description: Documentation Archive for Journalists and Scholars
url: "https://entheo.news.s2artslab.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - DEPLOY_TO_GITHUB.md
  - ai
  - scripts
  - POST_404_FIX.md
  - FIX_404_ISSUES.md

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Theme
theme: minima

# Permalinks
permalink: /:categories/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: "_pages"
    values:
      layout: page
  - scope:
      path: "_posts"
    values:
      layout: post
      permalink: /:year/:month/:day/:title/
